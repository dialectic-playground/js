# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# npm: one entry per implemented project (its package.json and package-lock.json).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (Node.js 24 (LTS)) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /00-hello-world
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
    commit-message:
      prefix: build
